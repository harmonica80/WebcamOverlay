name: Regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        shell: pwsh
        run: |
          Get-ChildItem src -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run regression tests
        run: node --test scripts/test-settings-persistence.js scripts/test-source-lifecycle.js scripts/test-matte-refiner.js scripts/test-overlay-recovery.js scripts/test-decoration.js
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Clean previous portable EXEs
        shell: pwsh
        run: Remove-Item release/WebcamOverlay-Portable-*.exe -Force -ErrorAction SilentlyContinue
      - name: Build Windows portable EXE
        run: npm run build:portable
      - name: Upload Windows portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: WebcamOverlay-Portable-0.2.45-candidate
          path: release/WebcamOverlay-Portable-*.exe
          if-no-files-found: error
          retention-days: 7

