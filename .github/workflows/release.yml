name: Release
# Publishes a GitHub release whenever main contains a package.json version that has no
# release yet (or when a v* tag is pushed). Release notes come from
# release-notes-v<version>.md: first line "# <title>", the rest is the release body.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to publish
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version" }
          gh release view $tag *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $notes = Test-Path "release-notes-$tag.md"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$((-not $exists) -and $notes)".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "version=$version release-exists=$exists notes=$notes"
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - name: Run regression tests
        if: steps.plan.outputs.publish == 'true'
        run: npm test
      - name: Build Windows portable EXE
        if: steps.plan.outputs.publish == 'true'
        run: npm run build:portable
      - name: Publish GitHub release
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $exe = "release/WebcamOverlay-Portable-$version.exe"
          if (!(Test-Path $exe)) { throw "Missing $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WebcamOverlay-Portable-$version.exe" | Out-File -Encoding ascii release/SHA256SUMS.txt
          $lines = Get-Content "release-notes-$env:TAG.md" -Encoding utf8
          $title = $lines[0].TrimStart('#').Trim()
          $lines | Select-Object -Skip 1 | Out-File -Encoding utf8 release/notes.md
          gh release create $env:TAG $exe release/SHA256SUMS.txt --target $env:GITHUB_SHA --title $title --notes-file release/notes.md
